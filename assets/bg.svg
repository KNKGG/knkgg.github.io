  <!-- 眼睛 -->
  <circle cx="718" cy="472" r="27" fill="#3b2f2f"/>
  <circle cx="882" cy="472" r="27" fill="#3b2f2f"/>
  <circle cx="727" cy="463" r="9" fill="#ffffff"/>
  <circle cx="891" cy="463" r="9" fill="#ffffff"/>

  <!-- 鼻子 + 嘴 -->
  <path d="M800 518 L785 538 L815 538 Z" fill="#d9836b"/>
  <path d="M800 538 Q800 558 783 555 M800 538 Q800 558 817 555" stroke="#3b2f2f" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 胡须 -->
  <path d="M655 522 L540 507 M655 542 L545 548 M945 522 L1060 507 M945 542 L1055 548" stroke="#3b2f2f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.45"/>

  <!-- 腮红 -->
  <circle cx="660" cy="548" r="22" fill="#f4a3a3" opacity="0.5"/>
  <circle cx="940" cy="548" r="22" fill="#f4a3a3" opacity="0.5"/>

  <!-- 点缀：四角星 -->
  <g fill="#e88a8a" opacity="0.55">
    <path d="M250 274 Q250 300 276 300 Q250 300 250 326 Q250 300 224 300 Q250 300 250 274 Z"/>
    <path d="M330 194 Q330 212 348 212 Q330 212 330 230 Q330 212 312 212 Q330 212 330 194 Z"/>
    <path d="M1350 274 Q1350 300 1376 300 Q1350 300 1350 326 Q1350 300 1324 300 Q1350 300 1350 274 Z"/>
    <path d="M1270 194 Q1270 212 1288 212 Q1270 212 1270 230 Q1270 212 1252 212 Q1270 212 1270 194 Z"/>
  </g>
</svg>
