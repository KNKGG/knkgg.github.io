<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ec"/>
      <stop offset="0.5" stop-color="#f5efe0"/>
      <stop offset="1" stop-color="#e9effb"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- 地面阴影 -->
  <ellipse cx="800" cy="905" rx="265" ry="42" fill="#e6dbc6" opacity="0.55"/>

  <!-- ===== 小猫（居中坐姿，浅橘色） ===== -->
  <!-- 尾巴 -->
  <path d="M930 790 Q1100 830 1090 700 Q1085 620 1035 615" stroke="#f4b183" stroke-width="48" stroke-linecap="round" fill="none"/>

  <!-- 身体 -->
  <ellipse cx="800" cy="730" rx="175" ry="185" fill="#f4b183"/>
  <ellipse cx="800" cy="765" rx="118" ry="128" fill="#fde3c8"/>

  <!-- 前爪 -->
  <ellipse cx="718" cy="892" rx="56" ry="34" fill="#f4b183"/>
  <ellipse cx="882" cy="892" rx="56" ry="34" fill="#f4b183"/>

  <!-- 头 -->
  <circle cx="800" cy="475" r="200" fill="#f4b183"/>

  <!-- 耳朵 -->
  <path d="M635 400 L645 240 L762 325 Z" fill="#f4b183"/>
  <path d="M662 380 L666 285 L742 328 Z" fill="#f7c293"/>
  <path d="M965 400 L955 240 L838 325 Z" fill="#f4b183"/>
  <path d="M938 380 L934 285 L858 328 Z" fill="#f7c293"/>

